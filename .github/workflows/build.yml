name: Build Universal macOS app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test version comparison and update validation
        run: python3 scripts/test_models.py
      - name: Build arm64 and x86_64
        run: python3 scripts/build.py --output build
      - name: Verify architectures and signature
        run: |
          lipo build/诗栖.app/Contents/MacOS/ShiQi -verify_arch arm64 x86_64
          codesign --verify --deep --strict build/诗栖.app
      - name: Package DMG
        run: python3 scripts/package_dmg.py build/诗栖.app build/ShiQi-1.7.0-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ShiQi-universal-dmg
          path: |
            build/*.dmg
            build/*.sha256
