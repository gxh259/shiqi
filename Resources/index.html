<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>诗栖</title><style>
*{box-sizing:border-box}body{margin:0;background:#141e20;color:#eee9de;font:14px -apple-system,BlinkMacSystemFont,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4}#background{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}body:before{content:'';position:fixed;inset:0;background:linear-gradient(90deg,rgba(8,20,21,.25),rgba(8,20,21,.6));z-index:-1}header{height:100px;padding:43px 40px 15px;display:flex;align-items:center;gap:15px}.logo{font:26px 'Songti SC',serif;letter-spacing:5px}.seal{background:#a74e3d;padding:5px 6px;border-radius:3px;font:16px 'Songti SC'}.muted{color:#c7c9bf;font-size:12px;letter-spacing:2px}.spacer{flex:1}button{border:1px solid #ffffff30;background:#ffffff12;color:inherit;border-radius:8px;padding:10px 15px;transition:.2s}button:hover{background:#ffffff27;border-color:#ffffff70}.primary{background:#e5ddc9;color:#233437;border-color:#e5ddc9}.primary:hover{background:#fff5dc}main{display:grid;grid-template-columns:1fr 480px;gap:40px;margin:30px 55px;height:calc(100vh - 240px);min-height:300px}.landscape{display:flex;flex-direction:column;justify-content:flex-end;padding:24px 0}.landscape h1{font:36px 'Songti SC',serif;letter-spacing:7px;font-weight:400;margin:10px 0 20px}.line{height:1px;background:#ffffff40;width:48px;margin-bottom:22px}article{background:#152322b8;backdrop-filter:blur(22px);border:1px solid #ffffff24;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;padding:32px 38px;box-shadow:0 24px 80px #0003}.eyebrow{font-size:10px;letter-spacing:4px;color:#d6c5a2}h2{font:30px 'Songti SC',serif;letter-spacing:4px;margin:18px 0 10px}#author{color:#c7c9bf;letter-spacing:3px;font-size:13px}#body{font:22px/2.1 'Songti SC',serif;white-space:pre-wrap;overflow:auto;flex:1;margin-top:22px;padding-right:8px}article footer{display:flex;gap:10px;border-top:1px solid #ffffff22;padding-top:16px;margin-top:18px}article footer button{padding:7px 10px;font-size:12px}.bar{display:flex;gap:12px;position:fixed;bottom:30px;left:40px;right:40px;align-items:center}.bar .meta{margin-left:auto;font-size:11px;color:#e2e2d0}kbd{opacity:.5;font-size:10px;margin-left:8px}#toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);border-radius:8px;background:#f0e6ce;color:#263a38;padding:12px 24px;display:none;z-index:100}dialog{background:#152725;color:#eee9de;border:1px solid #ffffff30;border-radius:16px;width:730px;max-height:80vh;padding:30px;box-shadow:0 20px 90px #0008}dialog::backdrop{background:#0712119c;backdrop-filter:blur(8px)}.dialoghead{display:flex;align-items:center;margin-bottom:20px}.dialoghead h2{font-size:23px;margin:0}.dialoghead button{margin-left:auto}input,select,textarea{border:1px solid #ffffff30;background:#ffffff0c;color:inherit;border-radius:7px;padding:10px}select option{background:#203b36}input[type=search]{width:100%;margin-bottom:15px}textarea{width:100%;height:200px;margin:14px 0;resize:vertical}.row{padding:13px 0;border-bottom:1px solid #ffffff1c;display:flex;gap:14px;align-items:center}.row .info{flex:1}.row small{display:block;margin-top:5px;color:#a3b7ae}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{position:relative;height:130px;background-size:cover;background-position:center;border-radius:8px;cursor:pointer;overflow:hidden}.tile button{position:absolute;bottom:7px;right:7px;background:#16251cbb;padding:5px}.reading{line-height:2;font:17px/2 'Songti SC',serif;white-space:pre-wrap}.field{display:flex;align-items:center;gap:20px;margin:18px 0}.field label{width:130px}.field input[type=range]{flex:1}#result{overflow:auto;max-height:54vh}.hint{font-size:12px;color:#b6c6bd;line-height:1.8}#fatal{padding:40px}
article{background:transparent!important;backdrop-filter:none;border:none;box-shadow:none;text-shadow:0 2px 12px #000b}article footer{border-top:0}body:before{background:linear-gradient(90deg,rgba(8,20,21,.08),rgba(8,20,21,.22))}h2,#author,#body{color:#fff8e8}main{grid-template-columns:1fr 520px}article{padding:20px 24px}.landscape h1{font-size:29px;text-shadow:0 2px 12px #0008}body.menu-panel{background:#152725}body.menu-panel #background,body.menu-panel header,body.menu-panel main,body.menu-panel .bar{display:none}body.menu-panel:before{display:none}body.menu-panel dialog{position:static;inset:auto;margin:0;width:100%;max-height:100vh;height:100vh;border:0;border-radius:0;padding:20px;box-shadow:none;background:#152725}body.menu-panel dialog::backdrop{background:transparent;backdrop-filter:none}body.menu-panel #result{max-height:380px}body.menu-panel #toast{bottom:12px}body.menu-panel .dialoghead h2{font-size:21px}</style><body><img id="background" alt="当前壁纸"><header><span class="seal">栖</span><span class="logo">诗栖</span><span class="muted">一屏山水 · 一首诗</span><span class="spacer"></span><button onclick="openPanel('search')">⌕ 搜索诗词</button><button onclick="openPanel('collection')">收藏与历史</button><button onclick="openPanel('settings')">☷ 设置</button></header><main><section class="landscape"><div class="line"></div><span class="muted">给日常，留一处诗意</span><h1>山水有意，诗自栖居。</h1><span id="imageInfo" class="muted"></span></section><article><span class="eyebrow" id="category"></span><h2 id="title"></h2><div id="author"></div><div id="body"></div><footer><button id="fav" onclick="favoritePoem()">♡ 收藏诗词</button><button onclick="openPanel('analysis')">诗词赏析 ↗</button><button onclick="native('copy',{text:poem().title+'\n'+poem().author+'\n'+poem().body})">复制</button></footer></article></main><div class="bar"><button class="primary" onclick="change('pair')">切换诗配图<kbd>F7</kbd></button><button onclick="change('wall')">切换壁纸<kbd>F8</kbd></button><button onclick="change('poem')">切换诗词<kbd>F9</kbd></button><button onclick="compose('wallpaper')">设为桌面</button><button onclick="openPanel('more')">更多 ···</button><span class="meta" id="count"></span></div><div id="toast" role="status"></div><dialog id="dialog"><div class="dialoghead"><h2 id="panelTitle"></h2><button onclick="dialog.close()">关闭 ✕</button></div><div id="panel"></div></dialog><script>
const $=s=>document.getElementById(s);const dialog=$('dialog');let state;try{state=JSON.parse(localStorage.getItem('shiqi-v1')||window.SHIQI_STATE||'{}')}catch{state={}}state={p:0,w:0,favorites:[],walls:[],history:[],custom:[],size:22,opacity:72,color:'#fff8e8',align:'left',interval:0,reminder:0,restDuration:300,...state};function migratePublicCorpus(){if(window.SHIQI_PUBLIC_CORPUS&&!state.fullCorpusMigrated){const aliases={0:119,1:252,2:'legacy-sample-2'};const used=[state.p,...state.favorites,...state.history.map(h=>h.p)];if(used.includes(2)&&!state.custom.some(p=>p.id==='legacy-sample-2'))state.custom.push({"id": "legacy-sample-2", "title": "饮湖上初晴后雨", "author": "苏轼", "body": "水光潋滟晴方好，山色空蒙雨亦奇。\n欲把西湖比西子，淡妆浓抹总相宜。", "category": "宋诗", "analysis": "此公开示例仅收录古诗正文，不包含现代出版物赏析。"});const remap=id=>Object.prototype.hasOwnProperty.call(aliases,id)?aliases[id]:id;state.p=remap(state.p);state.favorites=state.favorites.map(remap);state.history=state.history.map(h=>({...h,p:remap(h.p)}));state.fullCorpusMigrated=true;}}migratePublicCorpus();let poems=[...LIBRARY,...state.custom];state.w=Math.max(0,Math.min(WALLPAPERS.length-1,Number(state.w)||0));if(!poems.some(p=>p.id===state.p))state.p=poems[0].id;let timer,reminder,ttoast;let resting=false;let imageReady=Promise.resolve(),imageResolver;function displayImage(name,data){if(name!==WALLPAPERS[state.w])return;$('background').onload=()=>imageResolver?.();$('background').src=data;}const poem=()=>poems.find(p=>p.id===state.p)||poems[0];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('shiqi-v1',JSON.stringify(state));native('syncSettings',{json:JSON.stringify(state)})}catch{toast('存储空间不足，设置未保存')}}function native(action,data={}){window.webkit?.messageHandlers.native.postMessage({action,...data})}dialog.addEventListener('close',()=>native('dismissPanel'));function toast(t){native('feedback',{text:String(t)});$('toast').textContent=t;$('toast').style.display='block';clearTimeout(ttoast);ttoast=setTimeout(()=>$('toast').style.display='none',3000)}function render(record=true){let p=poem();imageReady=new Promise(resolve=>imageResolver=resolve);native('loadImage',{name:WALLPAPERS[state.w],size:String(state.size),align:state.align,shadow:String(state.opacity),color:state.color,restDuration:String(state.restDuration),text:poem().title+'\n'+poem().author+'\n\n'+poem().body});$('title').textContent=p.title;$('author').textContent=p.author;$('body').textContent=p.body;$('category').textContent=p.category+' / 离线诗库';for(let key of ['title','author','body'])$(key).style.color=state.color;$('body').style.fontSize=state.size+'px';$('body').style.textAlign=state.align;document.querySelector('article').style.textShadow=`0 2px 12px rgba(0,0,0,${state.opacity/100})`;$('fav').textContent=state.favorites.includes(p.id)?'♥ 已收藏':'♡ 收藏诗词';$('count').textContent=`${poems.length} 篇诗词 · ${WALLPAPERS.length} 张壁纸`;$('imageInfo').textContent=`本地影像 / ${String(state.w+1).padStart(3,'0')}`;if(record){state.history=state.history.filter(x=>!(x.p===p.id&&x.w===state.w));state.history.unshift({p:p.id,w:state.w,time:Date.now()});state.history=state.history.slice(0,200)}save()}
function different(n,old){return n<2?old:(old+1+Math.floor(Math.random()*(n-1)))%n}function change(type){if(type!=='wall'){let i=poems.findIndex(p=>p.id===poem().id);state.p=poems[different(poems.length,i)].id}if(type!=='poem')state.w=different(WALLPAPERS.length,state.w);render();toast(type==='pair'?'已切换诗配图':type==='wall'?'已切换壁纸':'已切换诗词')}function favoritePoem(){let id=poem().id;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];render(false);toast(state.favorites.includes(id)?'已收藏当前诗词':'已取消收藏诗词')}function favoriteWall(){state.walls=state.walls.includes(state.w)?state.walls.filter(x=>x!==state.w):[...state.walls,state.w];save();toast(state.walls.includes(state.w)?'壁纸已收藏':'已取消收藏壁纸')}
function openPanel(type){$('panel').innerHTML='';const titles={search:'寻一首诗',collection:'我的收藏',history:'最近读过',gallery:'精选诗配图',custom:'写下你的诗',analysis:'诗词赏析',settings:'偏好设置',more:'更多功能',display:'调整诗词显示'};$('panelTitle').textContent=titles[type]||'诗栖';let el=$('panel');if(type==='search'){el.innerHTML='<input id="query" type="search" placeholder="搜索标题、作者或诗句"><div id="result"></div>';$('query').oninput=()=>list(poems.filter(p=>(p.title+p.author+p.body).includes($('query').value)).slice(0,150));list(poems.slice(0,150))}
if(type==='analysis'){let p=poem();el.innerHTML=`<p class="hint">《${esc(p.title)}》 · ${esc(p.author)}<br>来源：用户提供的《唐诗宋词元曲古文》EPUB</p><div class="reading">${esc(p.analysis||'这首自定义诗词尚未添加赏析。可在自定义诗歌中填写赏析。')}</div>`}
if(type==='collection'){el.innerHTML='<div class="field"><button onclick="list(poems.filter(p=>state.favorites.includes(p.id)))">诗词收藏</button><button onclick="wallGrid(state.walls)">壁纸收藏</button><button onclick="openPanel(\'history\')">历史记录</button></div><div id="result"></div>';list(poems.filter(p=>state.favorites.includes(p.id)))}
if(type==='history'){el.innerHTML='<div id="result"></div>';let r=$('result');for(let h of state.history){let p=poems.find(p=>p.id===h.p);if(!p)continue;let b=document.createElement('div');b.className='row';b.innerHTML=`<div class="info">${esc(p.title)}<small>${esc(p.author)} · ${new Date(h.time).toLocaleString()}</small></div><button>重访诗画</button>`;b.querySelector('button').onclick=()=>{state.p=h.p;state.w=h.w;render();dialog.close()};r.append(b)}}
if(type==='gallery'){el.innerHTML='<p class="hint">从本地壁纸中选择画面，与你当前阅读的诗词搭配。</p><div id="result"></div>';wallGrid(WALLPAPERS.map((_,i)=>i))}
if(type==='custom'){el.innerHTML='<input id="ct" placeholder="诗题" maxlength="100"> <input id="ca" placeholder="作者" maxlength="60"><textarea id="cb" placeholder="在这里输入诗词正文"></textarea><textarea id="cx" style="height:90px" placeholder="赏析（选填）"></textarea><button class="primary" id="customSave">保存并阅读</button>';$('customSave').onclick=()=>{let title=$('ct').value.trim(),author=$('ca').value.trim(),body=$('cb').value.trim();if(!title||!body)return toast('请填写诗题和正文');let p={id:Date.now(),title,author:author||'佚名',body,analysis:$('cx').value.trim(),category:'自定义'};poems.push(p);state.custom.push(p);state.p=p.id;render();dialog.close();toast('自定义诗词已保存')}}
if(type==='settings'){el.innerHTML='<div class="field"><button onclick="native(\'login\')">登录时启动诗栖</button><button onclick="openPanel(\'display\')">调整诗歌显示</button><button onclick="native(\'screensaver\')">屏幕保护模式</button></div><div class="field"><label>休息提醒</label><select id="reminder"><option value="0">关闭</option><option value="1200">每 20 分钟</option><option value="1800">每 30 分钟</option><option value="3600">每小时</option></select></div><div class="field"><label>休息时长</label><select id="restDuration"><option value="20">20 秒</option><option value="60">1 分钟</option><option value="180">3 分钟</option><option value="300">5 分钟</option><option value="600">10 分钟</option></select><button onclick="requestRest()">现在休息一下</button></div><p class="hint">全屏诗画休息，倒计时结束自动返回；也可点击“继续搬砖”或按 Esc 提前返回。</p>';$('reminder').value=state.reminder;$('reminder').onchange=()=>applySetting('reminder',$('reminder').value);$('restDuration').value=state.restDuration;$('restDuration').onchange=()=>applySetting('restDuration',$('restDuration').value)}
if(type==='display'){el.innerHTML=`<div class="field"><label>字号</label><input id="font" type="range" min="16" max="38" value="${state.size}"><span id="fontValue">${state.size}</span></div><div class="field"><label>文字阴影浓度</label><input id="opacity" type="range" min="0" max="100" value="${state.opacity}"></div><div class="field"><label>字体颜色</label><input id="color" type="color" value="${state.color}" onclick="event.preventDefault();native('chooseColor')"></div><div class="field"><label>诗词对齐</label><select id="align"><option value="left">左对齐</option><option value="center">居中</option></select></div><div class="field"><label>自动切换诗画</label><select id="interval"><option value="0">关闭</option><option value="60">每分钟</option><option value="300">每 5 分钟</option><option value="900">每 15 分钟</option><option value="1800">每 30 分钟</option></select></div>`;for(let key of ['align','interval']){$(key).value=state[key];$(key).onchange=()=>applySetting(key,$(key).value)}$('font').oninput=()=>{applySetting('size',$('font').value);$('fontValue').textContent=state.size};$('opacity').oninput=()=>applySetting('opacity',$('opacity').value);$('color').oninput=()=>applySetting('color',$('color').value)}
if(type==='more'){el.innerHTML='<div id="actions" class="grid"></div>';for(let [label,fn] of [['收藏当前壁纸',favoriteWall],['自定义诗歌',()=>openPanel('custom')],['精选诗配图',()=>openPanel('gallery')],['调整诗词显示',()=>openPanel('display')],['历史记录',()=>openPanel('history')],['下载诗画截屏',()=>compose('export')],['仅保存壁纸',()=>native('saveOriginal',{name:WALLPAPERS[state.w]})],['分享诗配图',()=>compose('share')],['全屏屏保模式',()=>native('screensaver')],['动态壁纸',()=>native('video')],['停止动态壁纸',()=>native('stopVideo')],['选择显示器',()=>native('screens')],['版本更新',()=>native('update')]]){let b=document.createElement('button');b.textContent=label;b.onclick=fn;$('actions').append(b)}el.insertAdjacentHTML('beforeend','<p class="hint">动态壁纸使用你选择的本地视频，播放时保持静音。屏保模式为诗栖的全屏展示，按 Esc 退出。分享通过 macOS 分享菜单完成。</p>')}
if(!dialog.open)dialog.showModal();if(type==='search')$('query').focus()}
function list(items){let r=$('result');r.innerHTML='';if(!items.length){r.innerHTML='<p class="hint">这里还没有内容。试试收藏一首诗，或换个关键词。</p>';return}for(let p of items){let row=document.createElement('div');row.className='row';row.innerHTML=`<div class="info">${esc(p.title)}<small>${esc(p.author)} · ${esc(p.category)}<br>${esc(p.body.slice(0,38))}</small></div><button>阅读</button>`;row.querySelector('button').onclick=()=>{state.p=p.id;render();dialog.close()};r.append(row)}}
let thumbnailObserver;function wallGrid(ids){thumbnailObserver?.disconnect();thumbnailObserver=new IntersectionObserver(entries=>{for(const entry of entries){if(entry.isIntersecting){let tile=entry.target;native('thumbnail',{name:tile.dataset.name,index:tile.dataset.index});thumbnailObserver.unobserve(tile)}}},{root:$('result'),rootMargin:'150px'});let r=$('result');r.innerHTML='<div class="grid" id="tiles"></div>';if(!ids.length)r.innerHTML='<p class="hint">尚未收藏壁纸。</p>';for(let i of ids){let t=document.createElement('div');t.className='tile';t.id='wall-tile-'+i;t.dataset.name=WALLPAPERS[i];t.dataset.index=String(i);t.innerHTML='<button>使用此图</button>';t.onclick=()=>{state.w=i;render();dialog.close()};$('tiles').append(t);thumbnailObserver.observe(t)}}
function restStarted(){resting=true;clearInterval(timer);clearTimeout(reminder)}
function restFinished(){resting=false;timers()}
function requestRest(){if(resting)return;restStarted();native('rest')}
function timers(){clearInterval(timer);clearTimeout(reminder);if(resting)return;if(state.interval)timer=setInterval(()=>change('pair'),state.interval*1000);if(state.reminder)reminder=setTimeout(requestRest,state.reminder*1000)}
async function compose(action,onlyImage=false){try{await imageReady;let image=$('background');await image.decode();let c=document.createElement('canvas');c.width=2560;c.height=1600;let ctx=c.getContext('2d');let scale=Math.max(c.width/image.naturalWidth,c.height/image.naturalHeight);ctx.drawImage(image,(c.width-image.naturalWidth*scale)/2,(c.height-image.naturalHeight*scale)/2,image.naturalWidth*scale,image.naturalHeight*scale);if(!onlyImage){ctx.fillStyle='#071d1c22';ctx.fillRect(0,0,2560,1600);ctx.shadowColor=`rgba(0,0,0,${state.opacity/100})`;ctx.shadowBlur=10;ctx.shadowOffsetY=2;ctx.fillStyle='#d7c8a9';ctx.font='24px sans-serif';ctx.fillText('诗 栖 / '+poem().category,1530,230);ctx.fillStyle=state.color;let textX=state.align==='center'?1915:1530;ctx.textAlign=state.align;ctx.font='54px "Songti SC",serif';ctx.fillText(poem().title,textX,325,790);ctx.font='28px serif';ctx.fillText(poem().author,textX,390);ctx.font=`${state.size*1.7}px "Songti SC",serif`;let y=490,line='',overflow=false;let maxWidth=770;for(let char of poem().body){if(char==='\n'||ctx.measureText(line+char).width>maxWidth){ctx.fillText(line,textX,y);y+=state.size*3;line='';if(y>1310){overflow=true;break}if(char==='\n')continue}line+=char}if(!overflow)ctx.fillText(line,textX,y);else{ctx.font='24px serif';ctx.fillText('…… 余文请在诗栖内阅读',textX,1370)}ctx.font='28px "Songti SC",serif';ctx.fillStyle='#f4e9cd';ctx.fillText('一屏山水，一首诗。',120,1470)}native(action,{data:c.toDataURL('image/png')})}catch(e){toast('生成图片失败：'+e.message)}}
function setThumbnail(index,data){let tile=$('wall-tile-'+index);if(tile)tile.style.backgroundImage=`url("${data}")`}
function applySetting(key,value){if(key==='size')state.size=Math.max(16,Math.min(38,Number(value)||22));else if(key==='opacity')state.opacity=Math.max(0,Math.min(100,Number(value)||0));else if(key==='color'&&/^#[0-9a-f]{6}$/i.test(value))state.color=value.toLowerCase();else if(key==='align'&&['left','center'].includes(value))state.align=value;else if(key==='interval'&&[0,60,300,900,1800].includes(Number(value)))state.interval=Number(value);else if(key==='restDuration'&&[20,60,180,300,600].includes(Number(value)))state.restDuration=Number(value);else if(key==='reminder'&&[0,1200,1800,3600].includes(Number(value)))state.reminder=Number(value);else return;render(false);timers()}
function command(action){if(['pair','poem','wall'].includes(action))change(action);else if(action==='favorite')favoritePoem();else if(action==='favoriteWall')favoriteWall();else if(action==='wallpaper'||action==='export'||action==='share')compose(action);else if(action==='image')native('saveOriginal',{name:WALLPAPERS[state.w]});else if(action==='copy')native('copy',{text:poem().title+'\n'+poem().author+'\n'+poem().body});else openPanel(action)}document.addEventListener('keydown',e=>{let keys={F7:'pair',F8:'wall',F9:'poem'};if(keys[e.key]&&!dialog.open){e.preventDefault();change(keys[e.key])}});render();timers();
</script></body></html>
