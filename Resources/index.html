const $=s=>document.getElementById(s);const dialog=$('dialog');let state;try{state=JSON.parse(localStorage.getItem('shiqi-v1')||window.SHIQI_STATE||'{}')}catch{state={}}state={...typographyDefaults(),p:0,w:0,favorites:[],walls:[],history:[],custom:[],size:22,opacity:72,color:'#fff8e8',align:'left',position:'middle-right',interval:0,reminder:0,restDuration:300,...state};function migratePublicCorpus(){if(window.SHIQI_PUBLIC_CORPUS&&!state.fullCorpusMigrated){const aliases={0:119,1:252,2:'legacy-sample-2'};const used=[state.p,...state.favorites,...state.history.map(h=>h.p)];if(used.includes(2)&&!state.custom.some(p=>p.id==='legacy-sample-2'))state.custom.push({"id": "legacy-sample-2", "title": "饮湖上初晴后雨", "author": "苏轼", "body": "水光潋滟晴方好，山色空蒙雨亦奇。\n欲把西湖比西子，淡妆浓抹总相宜。", "category": "宋诗", "analysis": "此公开示例仅收录古诗正文，不包含现代出版物赏析。"});const remap=id=>Object.prototype.hasOwnProperty.call(aliases,id)?aliases[id]:id;state.p=remap(state.p);state.favorites=state.favorites.map(remap);state.history=state.history.map(h=>({...h,p:remap(h.p)}));state.fullCorpusMigrated=true;}}migratePublicCorpus();let poems=[...LIBRARY,...state.custom];state.w=Math.max(0,Math.min(WALLPAPERS.length-1,Number(state.w)||0));if(!poems.some(p=>p.id===state.p))state.p=poems[0].id;let timer,reminder,ttoast;let resting=false;let imageReady=Promise.resolve(),imageResolver;function displayImage(name,data){if(name!==WALLPAPERS[state.w])return;$('background').onload=()=>imageResolver?.();$('background').src=data;}const poem=()=>poems.find(p=>p.id===state.p)||poems[0];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('shiqi-v1',JSON.stringify(state));native('syncSettings',{json:JSON.stringify(state)})}catch{toast('存储空间不足，设置未保存')}}function native(action,data={}){window.webkit?.messageHandlers.native.postMessage({action,...data})}dialog.addEventListener('close',()=>native('dismissPanel'));function toast(t){native('feedbac function different(n,old){return n<2?old:(old+1+Math.floor(Math.random()*(n-1)))%n}function change(type){if(type==='pair'){const font=state.fontName,size=state.size,keepSettings=state.keepSettings,keepFont=state.keepFont;if(!keepSettings)Object.assign(state,typographyDefaults());if(keepFont){state.fontName=font;state.size=size}state.keepSettings=keepSettings;state.keepFont=keepFont;if(!keepFont){state.fontName='Songti SC';state.size=22}}if(type!=='wall'){let i=poems.findIndex(p=>p.id===poem().id);state.p=poems[different(poems.length,i)].id}if(type!=='poem')state.w=different(WALLPAPERS.length,state.w);render();toast(type==='pair'?'已切换诗配图':type==='wall'?'已切换壁纸':'已切换诗词')}function favoritePoem(){let id=poem().id;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];render(false);toast(state.favorites.includes(id)?'已收藏当前诗词':'已取消收藏诗词')}function favoriteWall(){state.walls=state.walls.includes(state.w)?state.walls.filter(x=>x!==state.w):[...state.walls,state.w];save();toast(state.walls.includes(state.w)?'壁纸已收藏':'已取消收藏壁纸')}

if(type==='history'){el.innerHTML='<div id="result"></div>';let r=$('result');for(let h of state.history){let p=poems.find(p=>p.id===h.p);if(!p)continue;let b=document.createElement('div');b.className='row';b.innerHTML=`<div class="info">${esc(p.title)}<small>${esc(p.author)} · ${new Date(h.time).toLocaleString()}</small></div><button>重访诗画</button>`;b.querySelector('button').onclick=()=>{state.p=h.p;state.w=h.w;render();dialog.close()};r.append(b)}}

const positionOptions=[['top-left','左上'],['top-center','顶部居中'],['top-right','右上'],['middle-left','左侧居中'],['middle-center','屏幕中央'],['middle-right','右侧居中'],['bottom-left','左下'],['bottom-center','底部居中'],['bottom-right','右下']];
function applySetting(key,value){if(applyTypography(key,value)){render(false);timers();return}if(key==='position'&&positionOptions.some(([v])=>v===value))state.position=value;else if(key==='size')state.size=Math.max(16,Math.min(96,Number(value)||22));else if(key==='opacity')state.opacity=Math.max(0,Math.min(100,Number(value)||0));else if(key==='color'&&/^#[0-9a-f]{6}$/i.test(value))state.color=value.toLowerCase();else if(key==='align'&&['default','left','center','right','justified'].includes(value))state.align=value;else if(key==='interval'&&[0,60,300,900,1800].includes(Number(value)))state.interval=Number(value);else if(key==='restDuration'&&[20,60,180,300,600].includes(Number(value)))state.restDuration=Number(value);else if(key==='reminder'&&[0,1200,1800,3600].includes(Number(value)))state.reminder=Number(value);else return;render(false);timers()}
function typographyDefaults(){return {fontName:'Songti SC',size:22,color:'#fff8e8',script:'original',direction:'horizontal',align:'left',indent:0,lineHeight:35,authorFormat:'brackets',underline:false,underlineStyle:'single',slant:0,removePeriod:false,removeComma:false,shadowEnabled:true,shadowColor:'#000000',opacity:72,shadowRadius:6,keepSettings:true,keepFont:true,position:'middle-right'}}
const typographyChoices={script:[['original','原文'],['simplified','简体'],['traditional','繁体']],direction:[['horizontal','横排'],['vertical','竖排（从右向左）']],align:[['default','默认（诗词左对齐，古文两端对齐）'],['left','左对齐'],['center','居中'],['right','右对齐'],['justified','两端对齐']],authorFormat:[['brackets','[唐] 李白'],['dot','唐 · 李白'],['after','李白〔唐〕'],['author','仅诗人姓名']],underlineStyle:[['single','单实线'],['double','双实线'],['dotted','点线'],['dashed','虚线']]};
function applyTypography(key,value){const defaults=typographyDefaults();if(!Object.hasOwn(defaults,key))return false;if(key==='resetDisplay'){return false}if(['fontName'].includes(key)){if(typeof value!=='string'||!value.trim()||value.length>200)return false;state[key]=value}else if(typographyChoices[key]){if(!typographyChoices[key].some(([v])=>v===value))return false;state[key]=value}else if(typeof defaults[key]==='boolean'){if(![true,false,'true','false'].includes(value))return false;state[key]=value===true||value==='true'}else if(['indent','lineHeight','slant','shadowRadius'].includes(key)){const limits={indent:[0,200],lineHeight:[16,200],slant:[-0.5,0.5],shadowRadius:[0,40]};const n=Number(value);if(!Number.isFinite(n))return false;state[key]=Math.max(limits[key][0],Math.min(limits[key][1],n))}else if(key==='shadowColor'){if(!/^#[0-9a-f]{6}$/i.test(value))return false;state[key]=value.toLowerCase()}else return false;return true}
function resetDisplay(){Object.assign(state,typographyDefaults());render(false);if(dialog.open)buildTypographyPanel($('panel'));toast('已恢复默认显示设置')}
function buildTypographyPanel(el){const select=(key,label)=>`<div class="field"><label>${label}</label><select data-style="${key}">${typographyChoices[key].map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></div>`;const number=(key,label,min,max,step=1)=>`<div class="field"><label>${label}</label><input data-style="${key}" type="number" min="${min}" max="${max}" step="${step}" style="width:115px"></div>`;const toggle=(key,label)=>`<div class="field"><label style="width:auto"><input data-style="${key}" type="checkbox"> ${label}</label></div>`;el.innerHTML=`<div class="field"><label>字体</label><button data-font-label onclick="native('chooseFont')">${esc(state.fontName)} · ${state.size} 磅…</button></div>${number('size','字号',16,96)}<div class="field"><label>字体颜色</label><input data-style="color" type="color" onclick="event.preventDefault();native('chooseStyleColor',{key:'color'})"></div>${select('script','简繁切换')}${select('direction','布局方向')}${select('align','对齐')}${number('indent','首行缩进（磅）',0,200)}<p class="hint">缩进数值与字号相同，约为一个汉字宽度；竖排时行高控制列间距。</p>${number('lineHeight','每行高度 / 列距',16,200)}${select('authorFormat','朝代诗人格式')}<p class="hint">朝代根据诗库分类显示；无法确定朝代时仅显示姓名。</p>${toggle('underline','下划线')}${select('underlineStyle','下划线类型')}${number('slant','文字倾斜',-0.5,0.5,0.05)}${toggle('removePeriod','去掉诗句中的句号')}${toggle('removeComma','去掉诗句中的逗号、顿号')}${toggle('shadowEnabled','文字阴影')}<div class="field"><label>阴影颜色</label><input data-style="shadowColor" type="color" onclick="event.preventDefault();native('chooseStyleColor',{key:'shadowColor'})"></div>${number('opacity','阴影不透明度（%）',0,100)}${number('shadowRadius','阴影半径',0,40)}${toggle('keepSettings','切换诗配图时，保持当前设置')}${toggle('keepFont','切换诗配图时，字体不变')}<p class="hint">关闭“保持当前设置”后，切换诗配图会恢复默认排版；字体是否保留由“字体不变”单独控制。原文、搜索、收藏不受简繁及标点显示设置影响。</p><button onclick="resetDisplay()">恢复默认</button>`;el.querySelectorAll('[data-style]').forEach(input=>{let key=input.dataset.style;if(input.type==='checkbox')input.checked=!!state[key];else input.value=state[key];if(input.type==='color')input.style.backgroundColor=state[key];input.onchange=()=>applySetting(key,input.type==='checkbox'?input.checked:input.value)})}

function command(action){if(action==='resetDisplay'){resetDisplay();return}if(['pair','poem','wall'].includes(action))change(action);else if(action==='favorite')favoritePoem();else if(action==='favoriteWall')favoriteWall();else if(action==='wallpaper'||action==='export'||action==='share')compose(action);else if(action==='image')native('saveOriginal',{name:WALLPAPERS[state.w]});else if(action==='copy')native('copy',{text:poem().title+'\n'+poem().author+'\n'+poem().body});else openPanel(action)}document.addEventListener('keydown',e=>{let keys={F7:'pair',F8:'wall',F9:'poem'};if(keys[e.key]&&!dialog.open){e.preventDefault();change(keys[e.key])}});render();timers();
</script></body></html>
